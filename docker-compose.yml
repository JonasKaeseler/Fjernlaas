# Lokal udvikling: SQL Server 2022.
# Start:  docker compose up -d   (SQL Server på localhost,14330; 1433 er ofte optaget af en lokal SQL Server)
# Stop:   docker compose down        (data bevares i volumen)
# Nulstil: docker compose down -v    (sletter data)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fjernlaas-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Fjernlaas_Dev_Pass1!}"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
