name: Udgiv

# Bygger billedet og lægger det i GitHub Container Registry. Kører manuelt eller når der sættes et versionstag (v1.0.0).
# Selve udrulningen på serveren sker kun, hvis secrets til SSH er sat (se docs/Drift.md).
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  billede:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.navn.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Navn på billedet (små bogstaver)
        id: navn
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fjernlaas" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.navn.outputs.image }}:latest
            ${{ steps.navn.outputs.image }}:${{ github.sha }}

  udrul:
    needs: billede
    runs-on: ubuntu-latest
    env:
      HAR_SERVER: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Udrul på serveren
        if: env.HAR_SERVER == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/fjernlaas
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            export APP_IMAGE="${{ needs.billede.outputs.image }}:${{ github.sha }}"
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$APP_IMAGE|" .env
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
